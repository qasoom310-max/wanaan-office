name: Tests + Deploy to office.wanaan-bh.com

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: PHPUnit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, xml, dom, intl, fileinfo, openssl, curl
          coverage: none
          tools: composer:v2

      - name: Install Composer deps (with dev)
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Bootstrap .env (test-only)
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci

      - name: Build the frontend
        run: npm run build

      - name: Keep the built frontend for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build
          if-no-files-found: error
          retention-days: 1

      - name: Run the tests
        run: php -d memory_limit=2G artisan test --compact

  deploy:
    name: Deploy to Hostinger (office.wanaan-bh.com)
    runs-on: ubuntu-latest
    needs: test
    # Off until the repository variable DEPLOY_ENABLED is set to "true" (after the secrets are in place).
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    env:
      # The server's command-line PHP must be 8.4 or newer. Set the repository variable PHP_BIN
      # (for example /opt/alt/php84/usr/bin/php) when plain "php" on the server is older.
      PHP_BIN: ${{ vars.PHP_BIN || 'php' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://office.wanaan-bh.com' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, xml, dom, intl, fileinfo, openssl, curl
          coverage: none
          tools: composer:v2

      - name: Composer install (production)
        run: composer install --no-dev --optimize-autoloader --no-progress --prefer-dist --no-interaction

      - name: Take the frontend built by the test job
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the server's SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Refuse a server whose PHP is too old
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "$PHP_BIN -r 'if (version_compare(PHP_VERSION, \"8.4.1\", \"<\")) { fwrite(STDERR, \"Server PHP is \".PHP_VERSION.\"; 8.4.1 or newer is needed. Set the PHP_BIN repository variable.\".PHP_EOL); exit(1); } echo \"Server PHP \".PHP_VERSION.PHP_EOL;'"

      # The server keeps its own settings, database, keys, uploads, logs and sessions: none are overwritten or deleted.
      - name: Rsync to Hostinger
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='.env' \
            --exclude='database/*.sqlite*' \
            --exclude='storage/app/' \
            --exclude='storage/logs/' \
            --exclude='storage/*.key' \
            --exclude='storage/framework/cache/data/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='storage/framework/testing/' \
            --exclude='public/storage' \
            --exclude='public/hot' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Remote post-deploy
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "set -e; cd ${{ secrets.DEPLOY_PATH }} && \
             mkdir -p storage/app/private storage/app/public storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views bootstrap/cache && \
             if [ ! -f .env ]; then \
               cp .env.example .env && \
               sed -i -e 's|^APP_ENV=.*|APP_ENV=production|' -e 's|^APP_DEBUG=.*|APP_DEBUG=false|' -e 's|^APP_URL=.*|APP_URL=$SITE_URL|' -e 's|^LOG_LEVEL=.*|LOG_LEVEL=warning|' .env && \
               chmod 600 .env && \
               $PHP_BIN artisan key:generate --force; \
             fi && \
             if [ ! -f database/database.sqlite ]; then touch database/database.sqlite && chmod 600 database/database.sqlite; fi && \
             $PHP_BIN artisan migrate --force && \
             $PHP_BIN artisan optimize:clear && \
             $PHP_BIN artisan config:cache && \
             $PHP_BIN artisan route:cache && \
             $PHP_BIN artisan view:cache"

      - name: Check the site answers
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL/login")
          echo "Login page answered $code"
          test "$code" = "200"

      - name: Check private files cannot be downloaded
        run: |
          for path in .env database/database.sqlite composer.json storage/logs/laravel.log; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SITE_URL/$path")
            echo "$path answered $code"
            if [ "$code" = "200" ]; then echo "PRIVATE FILE IS PUBLIC: $path"; exit 1; fi
          done
